name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: searchos
          POSTGRES_PASSWORD: searchos
          POSTGRES_DB: searchos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U searchos -d searchos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # CI-only values for throw-away service containers; not real secrets.
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://searchos:searchos@localhost:5432/searchos
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-0123456789-0123456789-abcdef
      CORS_ORIGINS: http://localhost:5173
      # The real-browser tests must run here, never silently skip.
      REQUIRE_BROWSER: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Install Chromium (JS rendering check)
        run: uv run playwright install --with-deps chromium
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy searchos
      - name: Alembic upgrade on an empty database
        run: uv run alembic upgrade head
      - name: docs/CHECKS.md is up to date
        run: uv run python -m searchos.audit.gen_docs --check
      - name: Pytest (real Postgres + Redis + Chromium)
        run: uv run pytest -q

  web:
    name: Web (typecheck, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  edge:
    name: Edge Worker (typecheck, tests in the Workers runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: edge/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: edge/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  wordpress:
    name: "WordPress plugin (real WordPress + MariaDB; deploy, verify, rollback)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: searchos
          POSTGRES_PASSWORD: searchos
          POSTGRES_DB: searchos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U searchos -d searchos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://searchos:searchos@localhost:5432/searchos
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-0123456789-0123456789-abcdef
      CORS_ORIGINS: http://localhost:5173
      # The test WordPress is on localhost
      DEPLOY_ALLOW_PRIVATE_HOSTS: "true"
      WP_TEST_URL: http://wp.test:8080
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check of the plugin
        run: |
          php -v
          find wp-plugin -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: echo "127.0.0.1 wp.test" | sudo tee -a /etc/hosts
      - name: Start MariaDB and WordPress (official images) with the plugin mounted
        run: |
          docker network create wpnet
          docker run -d --name db --network wpnet \
            -e MARIADB_ROOT_PASSWORD=root -e MARIADB_DATABASE=wordpress -e MARIADB_USER=wp -e MARIADB_PASSWORD=wp \
            mariadb:11
          docker run -d --name wp --network wpnet -p 8080:80 \
            -e WORDPRESS_DB_HOST=db -e WORDPRESS_DB_USER=wp -e WORDPRESS_DB_PASSWORD=wp -e WORDPRESS_DB_NAME=wordpress \
            -e "WORDPRESS_CONFIG_EXTRA=define('WP_ENVIRONMENT_TYPE','local'); define('WP_HOME','http://wp.test:8080'); define('WP_SITEURL','http://wp.test:8080');" \
            -v "$PWD/wp-plugin/searchos-connector:/var/www/html/wp-content/plugins/searchos-connector:ro" \
            -v "$PWD/wp-plugin/tests/fake-seo-plugin.php:/var/www/html/wp-content/mu-plugins/fake-seo-plugin.php:ro" \
            -v "$PWD/wp-plugin/tests/pixel.png:/tmp/pixel.png:ro" \
            wordpress:6-php8.2-apache
          for i in $(seq 1 60); do
            curl -s -o /dev/null -w '%{http_code}' http://wp.test:8080/ | grep -qE '^(200|302)$' && exit 0
            sleep 3
          done
          docker logs wp | tail -30
          exit 1
      - name: Install WordPress, activate the plugin, create content and an application password (wp-cli)
        run: |
          wpcli() {
            docker run --rm --network wpnet --volumes-from wp --user 33:33 \
              -v "$PWD/wp-plugin/tests/pixel.png:/tmp/pixel.png:ro" \
              -e WORDPRESS_DB_HOST=db -e WORDPRESS_DB_USER=wp -e WORDPRESS_DB_PASSWORD=wp -e WORDPRESS_DB_NAME=wordpress \
              wordpress:cli wp --path=/var/www/html "$@"
          }
          wpcli core install --url=http://wp.test:8080 --title="Test WP" --admin_user=admin --admin_password=adminpass123 --admin_email=admin@example.com --skip-email
          wpcli plugin activate searchos-connector
          wpcli rewrite structure '/%postname%/' --hard
          ATT=$(wpcli media import /tmp/pixel.png --porcelain)
          IMG=$(wpcli post get "$ATT" --field=guid)
          wpcli post create --post_type=post --post_status=publish --post_title="Coffee grinders" --post_name=coffee-grinders \
            --post_content="<p>We sell burr grinders for home brewing.</p><img src=\"$IMG\" alt=\"\">"
          PW=$(wpcli user application-password create admin searchos --porcelain)
          echo "WP_TEST_USER=admin" >> "$GITHUB_ENV"
          echo "WP_TEST_APP_PASSWORD=$PW" >> "$GITHUB_ENV"
          curl -fsS http://wp.test:8080/coffee-grinders/ | grep -q "Coffee grinders"
          curl -fsS -u "admin:$PW" http://wp.test:8080/wp-json/searchos/v1/status
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: "Deploy, verify raw HTML, roll back, original is back (no SEO plugin)"
        working-directory: backend
        run: uv run pytest tests/test_deploy_wordpress_live.py -q
      - name: "The same with an SEO plugin active (Yoast test double, filters and @graph JSON-LD)"
        working-directory: backend
        run: |
          docker run --rm --network wpnet --volumes-from wp --user 33:33 \
            -e WORDPRESS_DB_HOST=db -e WORDPRESS_DB_USER=wp -e WORDPRESS_DB_PASSWORD=wp -e WORDPRESS_DB_NAME=wordpress \
            wordpress:cli wp --path=/var/www/html option update searchos_fake_seo yoast
          WP_TEST_FAKE_SEO=yoast uv run pytest tests/test_deploy_wordpress_live.py -q
      - name: Deleting the plugin removes what it stored
        run: |
          wpcli() {
            docker run --rm --network wpnet --volumes-from wp --user 33:33 \
              -e WORDPRESS_DB_HOST=db -e WORDPRESS_DB_USER=wp -e WORDPRESS_DB_PASSWORD=wp -e WORDPRESS_DB_NAME=wordpress \
              wordpress:cli wp --path=/var/www/html "$@"
          }
          PW="$WP_TEST_APP_PASSWORD"
          curl -fsS -u "admin:$PW" -X PUT -H 'Content-Type: application/json' http://wp.test:8080/wp-json/searchos/v1/overrides \
            -d '{"url":"http://wp.test:8080/coffee-grinders/","set":{"title":"Uninstall check title"}}'
          test "$(wpcli db query "SELECT COUNT(*) FROM wp_postmeta WHERE meta_key='_searchos_overrides'" --skip-column-names)" = "1"
          wpcli plugin deactivate searchos-connector
          wpcli plugin uninstall searchos-connector --skip-delete || true
          wpcli eval 'define("WP_UNINSTALL_PLUGIN", true); include WP_PLUGIN_DIR . "/searchos-connector/uninstall.php";'
          test "$(wpcli db query "SELECT COUNT(*) FROM wp_postmeta WHERE meta_key='_searchos_overrides'" --skip-column-names)" = "0"

  compose:
    name: Docker dev stack boots (build, migrate, seed, login, web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.dev.yml config --quiet
      - name: Build and start the stack exactly as the owner runs it
        run: docker compose -f docker-compose.dev.yml up -d --build
      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 5
          done
          docker compose -f docker-compose.dev.yml logs api
          exit 1
      - name: Seed demo account and log in
        run: |
          docker compose -f docker-compose.dev.yml exec -T api python -m searchos.seed_demo
          curl -fsS -X POST http://localhost:8000/auth/login \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:5173' \
            -d '{"email":"demo@example.com","password":"demo-password-123"}' | grep -q access_token
      - name: Audits API answers (empty list for a new site)
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8000/auth/login \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:5173' \
            -d '{"email":"demo@example.com","password":"demo-password-123"}' | jq -r .access_token)
          SITE_ID=$(curl -fsS -X POST http://localhost:8000/sites \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"domain":"ci-audit-check.example.com"}' | jq -r .id)
          test "$SITE_ID" != "null" -a -n "$SITE_ID"
          BODY=$(curl -fsS "http://localhost:8000/sites/$SITE_ID/audits" -H "Authorization: Bearer $TOKEN")
          echo "GET /sites/$SITE_ID/audits -> $BODY"
          test "$(echo "$BODY" | jq -c .)" = "[]"
      - name: Audit the fixture site inside the worker image (Chromium works there)
        run: |
          docker compose -f docker-compose.dev.yml exec -T worker \
            python -m searchos.dev_crawl_fixture --email demo@example.com --inline --page-limit 100 | tee audit.txt
          grep -q "^Done: " audit.txt
          grep -q "JS rendering check: ran on" audit.txt
      - name: Action plan API works after the audit (no AI key set, so value actions wait for AI)
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8000/auth/login \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:5173' \
            -d '{"email":"demo@example.com","password":"demo-password-123"}' | jq -r .access_token)
          SITE_ID=$(curl -fsS http://localhost:8000/sites -H "Authorization: Bearer $TOKEN" | jq -r '.[] | select(.domain=="fixture.example") | .id')
          test -n "$SITE_ID"
          # The audit queues a plan job for the worker; give it up to 90 seconds.
          for i in $(seq 1 45); do
            N=$(curl -fsS "http://localhost:8000/sites/$SITE_ID/actions" -H "Authorization: Bearer $TOKEN" | jq 'length')
            [ "$N" -gt 0 ] && break
            sleep 2
          done
          echo "actions after the audit: $N"
          test "$N" -gt 0
          SUMMARY=$(curl -fsS "http://localhost:8000/sites/$SITE_ID/actions/summary" -H "Authorization: Bearer $TOKEN")
          echo "$SUMMARY" | jq -c '{total, by_status, by_risk, needs_ai, ai}'
          test "$(echo "$SUMMARY" | jq '.by_risk | length')" = "3"
          test "$(echo "$SUMMARY" | jq -r .ai.configured)" = "false"
          test "$(echo "$SUMMARY" | jq .needs_ai)" -gt 0
          test "$(curl -fsS "http://localhost:8000/sites/$SITE_ID/actions?status=needs_ai" -H "Authorization: Bearer $TOKEN" | jq '[.[] | select(.proposed_value != null)] | length')" = "0"
          curl -fsS "http://localhost:8000/sites/$SITE_ID/actions/export.csv" -H "Authorization: Bearer $TOKEN" | head -1 | grep -q "type"
          curl -fsS -X POST "http://localhost:8000/sites/$SITE_ID/actions/replan" -H "Authorization: Bearer $TOKEN" | jq -e '.type == "plan"'
          curl -fsS http://localhost:8000/ai/status -H "Authorization: Bearer $TOKEN" | jq -e '.configured == false and .anthropic_key_present == false'
      - name: Integrations report "Google isn't set up yet" without any Google env vars
        run: |
          BODY=$(curl -fsS http://localhost:8000/integrations/status)
          echo "GET /integrations/status -> $BODY"
          test "$(echo "$BODY" | jq -r .google.configured)" = "false"
          echo "$BODY" | jq -r .google.message | grep -q "isn't set up yet"
      - name: Search data API answers on synthetic Search Console data (no Google needed)
        run: |
          docker compose -f docker-compose.dev.yml exec -T api python -m searchos.dev_seed_gsc --email demo@example.com | tee seed.txt
          grep -q "^Seeded " seed.txt
          TOKEN=$(curl -fsS -X POST http://localhost:8000/auth/login \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:5173' \
            -d '{"email":"demo@example.com","password":"demo-password-123"}' | jq -r .access_token)
          SITE_ID=$(curl -fsS http://localhost:8000/sites -H "Authorization: Bearer $TOKEN" | jq -r '.[] | select(.domain=="harborandpine.example") | .id')
          test -n "$SITE_ID"
          DAYS=$(curl -fsS "http://localhost:8000/sites/$SITE_ID/search/totals?range=16m" -H "Authorization: Bearer $TOKEN" | jq '.series | length')
          echo "daily totals: $DAYS"
          test "$DAYS" -gt 400
          COUNTS=$(curl -fsS "http://localhost:8000/sites/$SITE_ID/search/opportunities" -H "Authorization: Bearer $TOKEN" | jq -c .counts)
          echo "opportunities: $COUNTS"
          test "$(echo "$COUNTS" | jq '[.[] | select(. > 0)] | length')" = "4"
      - name: Wait for web dev server
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:5173/ | grep -q '<div id="root"' && exit 0
            sleep 5
          done
          docker compose -f docker-compose.dev.yml logs web
          exit 1
      - name: No package-manager store leaked into the bind-mounted project folder
        run: |
          if [ -e web/.pnpm-store ]; then echo "web/.pnpm-store exists: pnpm store landed on the bind mount"; exit 1; fi
          docker compose -f docker-compose.dev.yml logs web | grep -q "Already up to date" || { echo "web container reinstalled packages on start"; docker compose -f docker-compose.dev.yml logs web | tail -30; exit 1; }
      - name: Worker and beat are running
        run: |
          docker compose -f docker-compose.dev.yml ps --status running --services | tee running.txt
          for s in postgres redis api worker beat web; do grep -qx "$s" running.txt || { docker compose -f docker-compose.dev.yml logs "$s"; exit 1; }; done
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail=200

  deploy-lint:
    name: Deploy kit lint (shellcheck, PowerShell parse, compose config, Caddyfile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck every shell script
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x deploy/oracle/*.sh scripts/*.sh
      - name: PowerShell scripts parse (Windows PowerShell 5.1 syntax subset) and are ASCII only
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem scripts/*.ps1) {
            $errors = $null; $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error "$($f.Name): $_" }; exit 1 }
            if ([System.IO.File]::ReadAllBytes($f.FullName) | Where-Object { $_ -gt 127 }) { Write-Error "$($f.Name) contains non-ASCII characters"; exit 1 }
          }
      - name: docker-compose.prod.yml parses
        run: |
          printf 'DOMAIN=x.example\nPOSTGRES_PASSWORD=x\nJWT_SECRET=x\nTOKEN_ENCRYPTION_KEY=x\n' > .env.prod
          docker compose --env-file .env.prod -f docker-compose.prod.yml config --quiet
          # Only Caddy publishes ports.
          test "$(docker compose --env-file .env.prod -f docker-compose.prod.yml config --format json | jq -r '[.services | to_entries[] | select(.value.ports != null) | .key] | join(",")')" = "caddy"
      - name: Caddyfile is valid
        run: |
          mkdir -p /tmp/caddy-etc && cp deploy/caddy/Caddyfile /tmp/caddy-etc/Caddyfile && cp deploy/caddy/tls-0.caddy /tmp/caddy-etc/tls.caddy
          sed -i 's#/etc/caddy/tls.caddy#/tmp/caddy-etc/tls.caddy#' /tmp/caddy-etc/Caddyfile
          docker run --rm -e SITE_ADDRESS=203-0-113-10.sslip.io -v /tmp/caddy-etc:/tmp/caddy-etc:ro caddy:2-alpine caddy validate --config /tmp/caddy-etc/Caddyfile --adapter caddyfile

  prod-stack:
    name: Production stack (Caddy + API under /api, HTTPS, cookie path, no exposed DB)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE: docker compose --env-file .env.prod -f docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v4
      - name: Create .env.prod (localhost, Caddy's internal CA, random secrets)
        run: |
          cat > .env.prod <<EOF
          DOMAIN=localhost
          CADDY_TLS_INTERNAL=1
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -hex 32)
          TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')
          ALLOW_REGISTRATION=false
          EOF
      - name: Build the production images
        run: $COMPOSE build
      - name: Start the stack and wait for every healthcheck
        run: $COMPOSE up -d --wait --wait-timeout 600
      - name: Web app is served at / (SPA) and falls back to index.html
        run: |
          curl -ksS --retry 10 --retry-all-errors --retry-delay 3 https://localhost/ | grep -q 'id="root"'
          curl -ksS https://localhost/sites/some/deep/link | grep -q 'id="root"'
          curl -ksSI https://localhost/ | tee headers.txt
          grep -qi '^strict-transport-security:' headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt
          grep -qi '^referrer-policy:' headers.txt
          grep -qi "^content-security-policy: .*frame-ancestors 'none'" headers.txt
          ASSET=$(curl -ksS https://localhost/ | grep -o '/assets/[^"]*\.js' | head -n 1)
          curl -ksSI "https://localhost$ASSET" | grep -qi 'cache-control: .*immutable'
      - name: API answers under /api (prefix stripped)
        run: |
          test "$(curl -ksS -o /dev/null -w '%{http_code}' https://localhost/api/health)" = "200"
          test "$(curl -ksS -o /dev/null -w '%{http_code}' https://localhost/api/docs)" = "404"
          test "$(curl -ksS -o /dev/null -w '%{http_code}' https://localhost/api/openapi.json)" = "404"
          case "$(curl -ksS -o /dev/null -w '%{http_code}' -X POST https://localhost/api/jobs/demo -H 'Content-Type: application/json' -d '{}')" in 404|405) ;; *) echo "demo endpoint is exposed"; exit 1 ;; esac
      - name: Public sign-up is off; the create_user CLI makes the first account
        run: |
          test "$(curl -ksS -o /dev/null -w '%{http_code}' -X POST https://localhost/api/auth/register -H 'Content-Type: application/json' -d '{"email":"x@example.com","password":"correct horse battery","org_name":"X"}')" = "403"
          printf '%s\n' 'correct horse battery' | $COMPOSE exec -T api python -m searchos.create_user --email ci@example.com --org "CI Org" --password-stdin
      - name: Login sets a Secure cookie with Path=/api/auth, and refresh works with it
        run: |
          curl -ksS -D login-headers.txt -c jar.txt -o login.json -X POST https://localhost/api/auth/login \
            -H 'Content-Type: application/json' -H 'Origin: https://localhost' \
            -d '{"email":"ci@example.com","password":"correct horse battery"}'
          cat login-headers.txt
          grep -qi '^HTTP/[0-9.]* 200' login-headers.txt
          grep -i '^set-cookie: searchos_refresh=' login-headers.txt | grep -qi 'Path=/api/auth'
          grep -i '^set-cookie: searchos_refresh=' login-headers.txt | grep -qi 'Secure'
          grep -i '^set-cookie: searchos_refresh=' login-headers.txt | grep -qi 'HttpOnly'
          jq -e '.access_token' login.json >/dev/null
          test "$(curl -ksS -b jar.txt -c jar.txt -o refresh.json -w '%{http_code}' -X POST https://localhost/api/auth/refresh -H 'Origin: https://localhost')" = "200"
          jq -e '.access_token' refresh.json >/dev/null
          # A refresh request from a foreign origin is refused.
          test "$(curl -ksS -b jar.txt -o /dev/null -w '%{http_code}' -X POST https://localhost/api/auth/refresh -H 'Origin: https://evil.example')" = "403"
      - name: Integrations report the public https redirect URI under /api
        run: |
          curl -ksS https://localhost/api/integrations/status | jq -e '.redirect_uri == "https://localhost/api/integrations/google/callback"'
      - name: Postgres, Redis and the API port are not reachable from the host
        run: |
          for p in 5432 6379 8000; do
            if (exec 3<>/dev/tcp/127.0.0.1/$p) 2>/dev/null; then echo "port $p is reachable from the host"; exit 1; fi
          done
          $COMPOSE ps --format '{{.Service}} {{.Ports}}' | tee ports.txt
          ! grep -E '^(postgres|redis|api|worker|beat) .*->' ports.txt
      - name: Worker has Chromium; beat and worker are running
        run: |
          $COMPOSE exec -T worker python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(args=["--no-sandbox", "--disable-dev-shm-usage"])
              page = b.new_page()
              page.set_content("<h1 id=x>hello</h1>")
              assert page.inner_text("#x") == "hello"
              b.close()
          print("chromium ok")
          PY
          $COMPOSE ps --status running --services | tee running.txt
          for s in caddy api worker beat postgres redis; do grep -qx "$s" running.txt || { $COMPOSE logs "$s"; exit 1; }; done
      - name: Data survives a restart (named volumes)
        run: |
          $COMPOSE restart api
          for i in $(seq 1 40); do curl -ksS -o /dev/null -f https://localhost/api/health && break; sleep 3; done
          curl -ksS -X POST https://localhost/api/auth/login -H 'Content-Type: application/json' -H 'Origin: https://localhost' \
            -d '{"email":"ci@example.com","password":"correct horse battery"}' | jq -e .access_token >/dev/null
      - name: Backup script produces a valid dump
        run: |
          BACKUP_DIR="$RUNNER_TEMP/backups" deploy/oracle/backup.sh
          ls -l "$RUNNER_TEMP"/backups
          gunzip -c "$RUNNER_TEMP"/backups/searchos-*.sql.gz | grep -q 'CREATE TABLE public.users'
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --tail=200

  arm64-build:
    name: Images build for linux/arm64 (Oracle Ampere A1; emulated, build only)
    # Emulated builds are slow and Chromium's dependencies are heavy. Not blocking; runs on main, manually, and for deploy/* branches.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'deploy/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Backend image (Python deps + Chromium) for arm64
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.prod
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=arm64-backend
          cache-to: type=gha,mode=max,scope=arm64-backend
      - name: Web + Caddy image for arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/caddy/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=arm64-caddy
          cache-to: type=gha,mode=max,scope=arm64-caddy
